# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=pi
template=template.md
cli=pi
spawnable=yes
# pi runs a skill as a slash command named `/skill:<name>` (pi docs/skills.md,
# "Skill Commands"), so the actas prompt is `/skill:agmsg actas <name>`.
cmd_prefix=/skill:
# `--model` takes "provider/id" and an optional ":<thinking>" suffix (pi 0.85.1
# --help). The initial prompt is a bare positional message, so no prompt_arg.
model_arg=--model
# `--session <path|id>` opens a prior session by file or (partial) UUID.
# `--resume` is the interactive picker and is NOT used here.
resume_arg=--session
# No name_arg, deliberately (same as opencode). pi has `--name <name>`, but a
# name_arg makes team.sh read the session name from the terminal title, and pi
# 0.85.1 titles its terminal "π - <name> - <cwd basename>", which the shared
# title reader (first word dropped, the rest is the name) reads as
# "- <name> - <cwd>": every pi seat would report cli_session=mismatch. Reading
# that title needs its own session_name_source, left for later.
# pi sets PI_CODING_AGENT=true for every child process (docs/environment-
# variables.md, "Process Marker"). AI_AGENT=pi is a generic, cross-tool marker,
# so it is not used as a strong marker here.
detect=PI_CODING_AGENT
# PI_SESSION_ID is injected into the bash tool's commands only (not into `!`
# commands). It is the session UUID pi names its session file after.
session_env=PI_SESSION_ID
# pi sets process.title to "pi"; the executable is node.
detect_proc=pi
# Per-project delivery marker, read by the global pi extension this type
# installs (agmsg-extension.ts). A project-local `.pi/extensions` would need pi's
# project-trust prompt and block a spawned seat; a plain file under `.pi/` does
# not count as a trusted resource (pi docs/security.md, "Project Trust").
hooks_file=.pi/agmsg-delivery
# The extension's agmsg_watch tool runs watch.sh with the actas name, which
# writes the spawn readiness sentinel.
readiness_sentinel=yes
delivery_modes=monitor turn off
